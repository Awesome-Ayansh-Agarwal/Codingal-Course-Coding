
<!DOCTYPE html>
<html>
<head>
    <title>Methods and Loops</title>

    <style>
        body {
            background-color: #252525;
            color: #ffffff;
            font-family: monospace;
            padding: 20px;
        }

        h2 {
            color: #55ff55;
            text-shadow: 2px 2px #225522;
        }

        p {
            background-color: #3b3b3b;
            border: 3px solid #55aa33;
            padding: 12px;
            font-size: 16px;
        }

        h2 {
            border-bottom: 4px solid #55aa33;
            padding-bottom: 10px;
        }
    </style>
</head>

<body>

<h2>Methods and Loops</h2>

<p>Numbers from 1 to 10</p>
<p id="numbers"></p>
<p id="random"></p>
<p id="day"></p>

<script>
    // PART 1: the numbers 1 to 10
    var text = "";

    for (var i = 1; i <= 10; i++) {
        text = text + i + "<br>";
    }

    document.getElementById("numbers").innerHTML = text;


    // PART 2: a random whole number from 0 to 99
    var randomNumber = Math.floor(Math.random() * 100);

    document.getElementById("random").innerHTML =
        "The random number is " + randomNumber;


    // PART 3: today's day number
    var dayNumber = new Date().getDay();

    document.getElementById("day").innerHTML =
        "Today's day number is " + dayNumber;
</script>

</body>
</html>
