<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      body {
        font-family: Arial;
        background-color: aliceblue;
        padding: 30px;
        text-align: center;
      }

      h1 {
        color: orangered;
      }
      p {
        color: #555;
      }

      .cards {
        background: white;
        border: 3px solid #ff5a43;
        border-radius: 12px;
        padding: 20px;
        width: 200px;
      }
      .card {
        background: white;
        border: 3px solid orangered;
        border-radius: 12px;
        padding: 20px;
        width: 200px;
      }

      .planet-name {
        font-size: 22px;
        font-weight: bold;
        color: #333;
      }
      .planet-fact {
        color: #666;
        margin-top: 10px;
        font-size: 14px;
      }
      button {
        background-color: orangered;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 10px;
        margin-top: 10px;
      }
    </style>
    <h1>My Planet Cards</h1>
    <p>Use javascript class to build planet cards!!!!!</p>
    <button onclick="showPlanets()">Show Planets !!</button>
    <div class="cards">
      <div id="card1"></div>
      <div id="card2"></div>
      <div id="card3"></div>
    </div>
    <script>
      class Planet {
        constructor(name, fact) {
          this.name = name;
          this.fact = fact;
        }
        describe() {
          return this.name + ":" + this.fact;
        }
      }

      function showPlanets() {
        let p1 = new Planet("Earth:The only planet with life");
        let p2 = new Planet("Mars:Known as the red planet");
        let p3 = new Planet("Saturn:Has beautiful rings made of ice");

        document.getElementById("card1").innerHTML =
          "<div class='card'><div class='planet-name'>" +
          p1.name +
          "</div>" +
          "<div class='planet-fact'>" +
          p1.describe() +
          "</div></div>";

        document.getElementById("card2").innerHTML =
          "<div class='card'><div class='planet-name'>" +
          p2.name +
          "</div>" +
          "<div class='planet-fact'>" +
          p2.describe() +
          "</div></div>";

        document.getElementById("card3").innerHTML =
          "<div class='card'><div class='planet-name'>" +
          p3.name +
          "</div>" +
          "<div class='planet-fact'>" +
          p3.describe() +
          "</div></div>";
      }
    </script>
  </body>
</html>
