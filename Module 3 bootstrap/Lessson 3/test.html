function go(){
  document.documentElement.requestFullscreen?.();
  document.getElementById("start").style.display="none";

  setTimeout(()=>{
    const s=document.getElementById("screen");
    const f=document.getElementById("face");
    const r=document.getElementById("red");

    f.src=img;
    s.style.display="block";

    // Horror sound
    const A=new AudioContext();
    const o=A.createOscillator();
    const g=A.createGain();

    o.type="sawtooth";
    o.frequency.setValueAtTime(1000,A.currentTime);
    o.frequency.exponentialRampToValueAtTime(55,A.currentTime+3);

    g.gain.setValueAtTime(.01,A.currentTime);
    g.gain.exponentialRampToValueAtTime(.8,A.currentTime+.05);
    g.gain.exponentialRampToValueAtTime(.001,A.currentTime+4);

    o.connect(g);
    g.connect(A.destination);
    o.start();
    o.stop(A.currentTime+4);

    const start=performance.now();

    function scare(t){
      let e=(t-start)/1000;
      let zoom=1+Math.min(e*1.3,2.5);
      let x=(Math.random()-.5)*55;
      let y=(Math.random()-.5)*55;

      f.style.transform=`translate(${x}px,${y}px) scale(${zoom})`;
      r.style.opacity=Math.random()<.3?Math.random()*.8:0;

      if(e<5) requestAnimationFrame(scare);
    }

    requestAnimationFrame(scare);
  },5000);
}
