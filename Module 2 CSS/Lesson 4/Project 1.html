<!DOCTYPE html>
<html>
<head>
  <title>My Ice Cream Shop Menu</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #fff9fb 0%, #ffe2f2 25%, #ffc7de 55%, #ff9dc3 100%);
      text-align: center;
      color: #4a2c2a;
      overflow-x: hidden;
      position: relative;
      padding: 24px 12px 30px;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      filter: blur(12px);
      opacity: 0.75;
      z-index: 0;
    }

    body::before {
      background: radial-gradient(circle at 30% 30%, #fffefc, #f9d6ef 38%, #ff90c2 100%);
      top: 8%;
      left: 8%;
    }

    body::after {
      background: radial-gradient(circle at 30% 30%, #fffefc, #d9f5ff 38%, #7ddcff 100%);
      right: 9%;
      bottom: 10%;
    }

    .page-title {
      position: relative;
      z-index: 1;
      margin: 0 0 10px;
      max-width: 700px;
      font-size: clamp(2.1rem, 4vw, 3.3rem);
      line-height: 1.15;
      letter-spacing: 1px;
      color: #d63384;
      text-shadow: 0 4px 12px rgba(214, 51, 132, 0.25);
      background: linear-gradient(135deg, #ff5ca8, #9f4dff, #ffae48);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      position: relative;
      z-index: 1;
      margin: 0 0 12px;
      padding: 10px 20px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid rgba(174, 92, 196, 0.25);
      box-shadow: 0 8px 18px rgba(184, 92, 166, 0.12);
      color: #8a2be2;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .shop-description {
      position: relative;
      z-index: 1;
      max-width: 520px;
      margin: 0 0 26px;
      padding: 14px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.55);
      border: 2px solid rgba(255, 105, 180, 0.25);
      box-shadow: 0 10px 25px rgba(255, 112, 181, 0.1);
      color: #9a2d72;
      font-size: 18px;
      line-height: 1.6;
      font-weight: 600;
    }

    .menu-box {
      position: relative;
      z-index: 1;
      width: min(92vw, 520px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 244, 251, 0.88));
      border: 3px solid rgba(255, 105, 180, 0.9);
      border-radius: 30px;
      padding: 28px 22px 22px;
      box-shadow: 0 22px 45px rgba(196, 95, 152, 0.22), inset 0 1px 0 rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
    }

    .menu-box::before {
      content: "";
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 42px;
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(180deg, #ffd6ea, #ffb5d7);
      box-shadow: 0 8px 16px rgba(255, 138, 196, 0.25);
    }

    h2 {
      margin: 12px 0 20px;
      font-size: 26px;
      color: #a3357a;
      letter-spacing: 0.5px;
    }

    .icecream-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .icecream-option {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 62px;
      background: linear-gradient(135deg, #fff0f7, #ffe2f0);
      color: #5c2a4a;
      font-size: 18px;
      font-weight: 700;
      padding: 14px 18px;
      border-radius: 18px;
      border: 2px solid #ffc3d8;
      box-shadow: 0 4px 14px rgba(255, 140, 188, 0.12);
      cursor: pointer;
      transition: transform 0.35s ease, box-shadow 0.35s ease, background 0.35s ease, color 0.35s ease, border-color 0.35s ease;
    }

    .icecream-option input {
      width: 22px;
      height: 22px;
      accent-color: #ff4db8;
      flex-shrink: 0;
      cursor: pointer;
    }

    .option-name {
      flex: 1;
      text-align: left;
    }

    .option-price {
      color: #a3357a;
      font-weight: 800;
      white-space: nowrap;
    }

    .icecream-option:hover {
      background: linear-gradient(135deg, #ff71bd, #ff8dbd 37%, #b048ff 100%);
      color: white;
      border-color: #ff4dad;
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(178, 63, 154, 0.35);
    }

    .icecream-option:hover .option-price {
      color: white;
    }

    .cta-row {
      position: relative;
      z-index: 1;
      margin-top: 10px;
    }

    button {
      background: linear-gradient(135deg, #ff5ca8, #b24dff, #ff9d45);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 15px 32px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 12px 22px rgba(181, 76, 164, 0.28);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 18px 28px rgba(141, 79, 204, 0.35);
      filter: brightness(1.08);
    }

    .order-button {
      padding: 16px 36px;
      font-size: 18px;
      border: 3px solid rgba(255,255,255,0.35);
    }

    @media (max-width: 520px) {
      .page-title {
        font-size: 36px;
      }

      .shop-description {
        font-size: 16px;
      }

      .icecream-option {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <h1 class="page-title">Ice Cream That Steals Your Heart</h1>
  <p class="tagline">Welcome to Scoops of Joy!</p>
  <p class="shop-description">
    Fresh, creamy, colorful scoops that turn every craving into a happy little celebration.
  </p>

  <div class="menu-box">
    <h2>Choose Your Flavours</h2>
    <form id="ice-cream-form" class="icecream-form">
      <label class="icecream-option">
        <input type="checkbox" name="flavor" value="Chocolate Delight" data-price="120">
        <span class="option-name">Chocolate Delight</span>
        <span class="option-price">₹120</span>
      </label>

      <label class="icecream-option">
        <input type="checkbox" name="flavor" value="Strawberry Swirl" data-price="130">
        <span class="option-name">Strawberry Swirl</span>
        <span class="option-price">₹130</span>
      </label>

      <label class="icecream-option">
        <input type="checkbox" name="flavor" value="Mango Magic" data-price="150">
        <span class="option-name">Mango Magic</span>
        <span class="option-price">₹150</span>
      </label>

      <label class="icecream-option">
        <input type="checkbox" name="flavor" value="Vanilla Dream" data-price="110">
        <span class="option-name">Vanilla Dream</span>
        <span class="option-price">₹110</span>
      </label>

      <label class="icecream-option">
        <input type="checkbox" name="flavor" value="Blueberry Blast" data-price="140">
        <span class="option-name">Blueberry Blast</span>
        <span class="option-price">₹140</span>
      </label>

      <div class="cta-row">
        <button type="submit" class="order-button">Order Now</button>
      </div>
    </form>
  </div>

  <script>
    const orderForm = document.getElementById('ice-cream-form');

    orderForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const selected = Array.from(document.querySelectorAll('input[name="flavor"]:checked')).map((item) => ({
        name: item.value,
        price: Number(item.dataset.price)
      }));

      if (selected.length === 0) {
        alert('Please choose at least one ice cream flavour before ordering.');
        return;
      }

      localStorage.setItem('selectedIceCream', JSON.stringify(selected));
      window.location.href = 'order.html';
    });
  </script>
</body>
</html>
