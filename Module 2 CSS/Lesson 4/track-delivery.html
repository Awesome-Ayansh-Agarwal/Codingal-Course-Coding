<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Your Delivery</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #fff9fb 0%, #ffe2f2 25%, #ffc7de 55%, #ff9dc3 100%);
      color: #4a2c2a;
      padding: 24px 12px;
    }

    .track-box {
      width: min(92vw, 620px);
      background: rgba(255,255,255,0.9);
      border: 3px solid rgba(255, 105, 180, 0.9);
      border-radius: 30px;
      padding: 26px 22px;
      box-shadow: 0 22px 45px rgba(196, 95, 152, 0.22);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      text-align: center;
      background: linear-gradient(135deg, #ff5ca8, #9f4dff, #ffae48);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .status {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: #9a2d72;
      margin-bottom: 20px;
    }

    .map {
      position: relative;
      height: 260px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(180deg, #dff8ff 0%, #f8f9ff 50%, #e4ffd9 100%);
      border: 3px solid #c7e9ff;
      margin-bottom: 20px;
    }

    .road {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 40px;
      height: 26px;
      background: linear-gradient(180deg, #d1d2d8, #aeb1ba);
      border-top: 4px solid #8b8e97;
      border-bottom: 4px solid #8b8e97;
    }

    .road::before,
    .road::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: repeating-linear-gradient(
        to right,
        #ffffff 0,
        #ffffff 18px,
        transparent 18px,
        transparent 34px
      );
      top: 10px;
    }

    .society {
      position: absolute;
      right: 40px;
      bottom: 52px;
      width: 120px;
      height: 84px;
      background: #cfe7ff;
      border: 3px solid #7cb1eb;
      border-radius: 12px;
      box-shadow: inset 0 -8px 0 rgba(124, 177, 235, 0.2);
    }

    .society::before {
      content: "Society";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #2d6bac;
    }

    .driver {
      position: absolute;
      left: 18%;
      bottom: 64px;
      width: 56px;
      height: 56px;
      background: linear-gradient(180deg, #ffd1df, #ff8ec3);
      border: 3px solid #c23c91;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      animation: ride 4s infinite ease-in-out;
    }

    @keyframes ride {
      0% { left: 12%; }
      50% { left: 56%; }
      100% { left: 72%; }
    }

    .driver::after {
      content: "🚗";
      position: absolute;
      left: -14px;
      bottom: -10px;
      font-size: 36px;
      transform: scaleX(1.3);
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
      color: #6e346b;
      border: 1px solid rgba(255, 105, 180, 0.3);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff8dc4;
      box-shadow: 0 0 0 4px rgba(255, 141, 196, 0.2);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .actions a {
      text-decoration: none;
      background: linear-gradient(135deg, #ff5ca8, #b24dff, #ff9d45);
      color: white;
      border-radius: 999px;
      padding: 12px 22px;
      font-weight: 800;
      box-shadow: 0 12px 22px rgba(181, 76, 164, 0.28);
    }

    .secret-button {
      opacity: 1;
      font-size: 12px;
      padding: 10px 16px;
      position: static;
      display: inline-block;
      margin-top: 18px;
      background: linear-gradient(135deg, #1b1b1b, #3d3d3d, #7a1d1d);
      color: #fff;
      border: 2px solid #ff4d4d;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 8px 18px rgba(110, 0, 0, 0.4);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .secret-button:hover {
      transform: scale(1.04);
    }

    .jump-scare {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, rgba(255,255,255,0.3), rgba(0,0,0,0.92) 55%);
      z-index: 9999;
      overflow: hidden;
    }

    .jump-scare.active {
      display: flex;
      animation: flash 0.18s linear infinite alternate;
    }

    .explode {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, #fff6c2 0%, #ffb703 20%, #ff5c8a 42%, rgba(0,0,0,0.9) 72%);
      opacity: 0;
      transform: scale(0.4);
    }

    .jump-scare.active .explode {
      animation: explode 0.9s ease-out forwards;
    }

    .freddy-world {
      position: relative;
      width: min(90vw, 900px);
      height: min(82vh, 700px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.2) rotate(-8deg);
      filter: blur(10px);
    }

    .jump-scare.active .freddy-world {
      animation: teleportIn 1.1s ease-out 0.8s forwards;
    }

    .freddy {
      position: relative;
      width: min(76vw, 500px);
      height: min(72vh, 560px);
      background: #d8d5d0;
      border-radius: 30% 30% 20% 20%;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.2), 0 0 80px rgba(255, 0, 80, 0.4);
      animation: pop 0.9s ease-in-out infinite alternate;
      border: 8px solid #2a2a2a;
      overflow: hidden;
      z-index: 2;
    }

    .freddy::before,
    .freddy::after {
      content: "";
      position: absolute;
      top: 90px;
      width: 82px;
      height: 82px;
      background: #f0f0f0;
      border-radius: 50%;
      border: 8px solid #2a2a2a;
    }

    .freddy::before { left: 95px; }
    .freddy::after { right: 95px; }

    .freddy .eye {
      position: absolute;
      top: 120px;
      width: 30px;
      height: 30px;
      background: #ff3b3b;
      border-radius: 50%;
      box-shadow: 0 0 18px rgba(255, 59, 59, 0.9);
      animation: blink 0.2s infinite alternate;
    }

    .freddy .left-eye { left: 135px; }
    .freddy .right-eye { right: 135px; }

    .freddy .smile {
      position: absolute;
      left: 50%;
      bottom: 120px;
      transform: translateX(-50%);
      width: 170px;
      height: 100px;
      border: 12px solid #2a2a2a;
      border-top: 0;
      border-radius: 0 0 120px 120px;
      background: transparent;
    }

    .freddy .teeth {
      position: absolute;
      left: 50%;
      bottom: 96px;
      transform: translateX(-50%);
      width: 138px;
      height: 32px;
      background: repeating-linear-gradient(
        to right,
        #fff 0,
        #fff 10px,
        #d7d7d7 10px,
        #d7d7d7 18px
      );
      border-radius: 0 0 12px 12px;
      border: 4px solid #2a2a2a;
    }

    .freddy .hat {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 250px;
      height: 80px;
      background: #d6d3cf;
      border: 8px solid #2a2a2a;
      border-radius: 18px 18px 12px 12px;
    }

    .freddy .hat::before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: -14px;
      width: 52px;
      height: 28px;
      background: #2a2a2a;
      border-radius: 8px;
    }

    .land {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,0.18), transparent 20%),
        linear-gradient(180deg, #161b2e 0%, #2c1d47 30%, #1f1038 100%);
      opacity: 0;
    }

    .jump-scare.active .land {
      animation: landGlow 1.4s ease-out 0.8s forwards;
    }

    .moon {
      position: absolute;
      right: 12%;
      top: 14%;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fffef5, #f3f1ff 50%, #c4cfe9 100%);
      box-shadow: 0 0 30px rgba(255,255,255,0.4);
      opacity: 0;
    }

    .jump-scare.active .moon {
      animation: moonRise 1.2s ease-out 0.9s forwards;
    }

    .castle {
      position: absolute;
      bottom: 14%;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 200px;
      border-radius: 18px 18px 0 0;
      background: linear-gradient(180deg, #4b2f8a, #1a1337);
      border: 6px solid #7b6cd8;
      opacity: 0;
    }

    .jump-scare.active .castle {
      animation: castleShow 1.4s ease-out 1s forwards;
    }

    .castle::before,
    .castle::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 44px;
      height: 80px;
      background: #7b6cd8;
      border: 4px solid #1a1337;
    }

    .castle::before { left: 30px; }
    .castle::after { right: 30px; }

    @keyframes explode {
      0% { opacity: 0; transform: scale(0.15); }
      20% { opacity: 1; transform: scale(1); }
      48% { opacity: 1; transform: scale(1.7); }
      100% { opacity: 0; transform: scale(3.2); }
    }

    @keyframes teleportIn {
      0% { opacity: 0; transform: scale(0.2) rotate(-8deg) translateY(80px); filter: blur(12px); }
      55% { opacity: 1; transform: scale(1.08) rotate(0deg) translateY(0); filter: blur(0); }
      100% { opacity: 1; transform: scale(1) rotate(0deg) translateY(0); filter: blur(0); }
    }

    @keyframes flash {
      0% { background: rgba(0,0,0,0.95); }
      100% { background: rgba(30,20,40,0.82); }
    }

    @keyframes blink {
      0% { transform: scaleY(1); }
      100% { transform: scaleY(0.2); }
    }

    @keyframes pop {
      0% { transform: scale(0.92) translateY(20px); }
      100% { transform: scale(1.06) translateY(-12px); }
    }

    @keyframes moonRise {
      0% { opacity: 0; transform: scale(0.5) translateY(60px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes landGlow {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes castleShow {
      0% { opacity: 0; transform: translateX(-50%) scale(0.6) translateY(40px); }
      100% { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
    }
  </style>
</head>
<body>
  <div class="track-box">
    <h1>Track Your Delivery</h1>
    <div class="status">Driver is bringing your ice cream to your society</div>

    <div class="map">
      <div class="road"></div>
      <div class="society"></div>
      <div class="driver">🙂</div>
    </div>

    <div class="steps">
      <div class="step"><span class="dot"></span> Order confirmed</div>
      <div class="step"><span class="dot"></span> Ice cream packed and ready</div>
      <div class="step"><span class="dot"></span> Driver is on the way</div>
      <div class="step"><span class="dot"></span> Arriving at your society soon</div>
    </div>

    <div class="actions">
      <a href="Project 1.html">Back to Menu</a>
      <a href="order.html">View Order</a>
    </div>

    <button class="secret-button" id="secretButton">Secret Option</button>
  </div>

  <div class="jump-scare" id="jumpScare">
    <div class="explode"></div>
    <div class="land"></div>
    <div class="moon"></div>
    <div class="castle"></div>
    <div class="freddy-world">
      <div class="freddy">
        <div class="hat"></div>
        <div class="eye left-eye"></div>
        <div class="eye right-eye"></div>
        <div class="smile"></div>
        <div class="teeth"></div>
      </div>
    </div>
  </div>

  <script>
    const secretButton = document.getElementById('secretButton');
    const jumpScare = document.getElementById('jumpScare');

    secretButton.addEventListener('click', () => {
      jumpScare.classList.remove('active');
      void jumpScare.offsetWidth;
      jumpScare.classList.add('active');

      const audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
      audio.volume = 0.8;
      audio.play().catch(() => {});

      setTimeout(() => {
        jumpScare.classList.remove('active');
      }, 3200);
    });
  </script>
</body>
</html>
