<!DOCTYPE html>
<html>
<head>
    <title>Moving Target</title>
    <style>
        #targetButton {
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute; /* This is key! Allows us to set top/left */
            top: 50px; /* Starting position */
            left: 50px; /* Starting position */
            cursor: pointer; /* Shows it's clickable */
            transition: all 0.2s ease-out; /* Makes the move smoother */
        }
    </style>
</head>
<body>
    <h1>Click the Moving Target!</h1>
    <button id="targetButton">Target</button>

    <script>
        const button = document.getElementById('targetButton');

        button.addEventListener('click', function() {
            console.log('Target hit!');
            alert('BAM! You hit the target!');

            // Calculate new random positions
            // window.innerWidth and innerHeight give us the screen size
            const newX = Math.random() * (window.innerWidth - 120); // -120 to keep button fully on screen
            const newY = Math.random() * (window.innerHeight - 120);

            // Apply the new positions
            button.style.left = newX + 'px';
            button.style.top = newY + 'px';
        });
    </script>
</body>
</html>
